<!DOCTYPE html>
<html>

<head>
    <title>Practica Hiragana</title>
    <script src="https://kit.fontawesome.com/73cdc631b4.js" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Kana.css">
</head>

<body>
    <div id="window">
        <header>
            <img class="gato" src="gato.png" />
            <div>
                <h1>Aprende Japonés</h1>
                <h2>Hiragana / Katakana</h2>
            </div>
        </header>
        <div id="racha">
            <div id="streak">
                <img class="fire" src="fire.png" />
                <div class="make-it-column">
                    <p class="streak-message">Racha Actual</p>
                    <p id="current-streak-js" class="streak-number">0</p>
                </div>
            </div>
            <div id="streak">
                <img class="clown" src="clown.png" />
                <div class="make-it-column">
                    <p class="streak-message">Racha Maximo</p>
                    <p id="max-streak-js" class="streak-number">0</p>
                </div>
            </div>
        </div>
        <div id="question-window">
            <p id="mode-display">ひらがな</p>
            <p id="question">あ</p>
            <p id="veces"></p>


            <input id="answer" type="text" placeholder="Escribe tu respuesta...">

            <button id="checkButton">Entrega</button>
            <div id="result-window">
                <div id="result-muybien">
                    <i class="fa-solid fa-check fa-fw correcto"></i>
                    <p id="result-correcto" class="correcto result"></p>
                </div>
                <div id="result-error">
                    <i class="fa-solid fa-xmark fa-fw incorrecto"></i>
                    <p id="result-incorrecto" class="incorrecto result"></p>
                </div>
                <p id="mistake-kana" class="incorrecto"></p>
                <p id="tu-respuesta" class="incorrecto">Tu respuesta: <span id="yourAnswer" class="bold"></span></p>
                <p id="respuesta-correcta" class="incorrecto">Respuesta correcta: <span id="correctAnswer"
                        class="bold"></span></p>
            </div>
            <p id="equivocado"></p>
        </div>
        <div class="center">
            <div id="switch-container">
                <input type="radio" id="hiragana-switch" name="switch" checked onclick=kanaMode(0)>
                <label for="hiragana-switch" class="switch-label left-radius">Hiragana</label>
                <input type="radio" id="katakana-switch" name="switch" onclick=kanaMode(1)>
                <label for="katakana-switch" class="switch-label right-radius">Katakana</label>
                <div id="switch-glider"></div>
            </div>
        </div>
        <script src="./Kana.js"></script>
    </div>
</body>

</html>
